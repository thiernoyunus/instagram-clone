<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
        <img class="logo" src="images/logo.png">
        <img class="profile-pic" src="images/user-avatar.png">
        </header>
        <article class="post">
            <div class="friend-info">
                <img class="profile-pic" src="images/avatar-vangogh.jpg" alt="profile picture of vangogh">
                <div class="about-friend">
                    <p class="friend-full-name">Vincent van Gogh</p>
                    <p class = "friend-location">Zudert, Netherlands</p>
                </div>
            </div>
            <img class="post-image" src="images/post-vangogh.jpg" alt="post made by vangogh">
            <div>
            <div class="post-engagement">
                <img class="heart-icon" src="images/icon-heart.png" alt="image of a heart icon">
                <img class="comment-icon" src="images/icon-comment.png" alt="image of a comment icon">
                <img class="dm-icon" src="images/icon-dm.png" alt="image of a dm icon">
            </div>
            <p class="likes-count">21,492 likes</p>
            <p class="post-caption"><span>vincey1853</span> just took a few mushrooms lol</p>
            </div>  
        </article>
        <script src="index.js"></script>
    </body>
</html>
